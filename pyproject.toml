[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sik-link"
version = "0.1.0"
description = "A small reliable point-to-point protocol for SiK transparent serial radios"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "msgpack>=1.0,<2",
  "pyserial>=3.5,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
sik-link = "siklink.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["siklink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
